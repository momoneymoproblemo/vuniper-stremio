<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuniper for Stremio</title>
<style>
  :root { --bg:#0f0e17; --card:#1b1a27; --text:#f2f0ff; --muted:#a29fbd; --accent:#8a5cf6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:20px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:-0.02em; }
  p { margin:0 0 20px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0 0 28px; text-align:left; }
  li { padding:12px 14px; background:#0001; border:1px solid #ffffff14; border-radius:12px; margin-bottom:8px; }
  li b { display:block; } li span { color:var(--muted); font-size:14px; }
  .btn { display:block; width:100%; padding:16px; border-radius:14px; background:var(--accent); color:#fff;
         font-weight:700; font-size:18px; text-decoration:none; }
  .small { margin:18px 0 0; font-size:13px; }
  code { display:block; margin-top:8px; padding:10px; background:#0004; border-radius:8px; color:var(--text);
         font-size:12px; word-break:break-all; user-select:all; }
</style>
</head>
<body>
<main>
  <h1>Vuniper</h1>
  <p>Two movie rows for Stremio, refreshed every 6 hours.</p>
  <ul>
    <li><b>Now Online</b><span>Films that have just landed on digital</span></li>
    <li><b>Hidden Gems</b><span>Under-the-radar picks</span></li>
  </ul>
  <a class="btn" id="install" href="#">Install in Stremio</a>
  <p class="small">Button not working? In Stremio, open Add-ons and paste this into the search bar:
    <code id="url"></code></p>
</main>
<script>
  const base = location.href.replace(/[^/]*$/, '');
  const manifest = base + 'manifest.json';
  document.getElementById('url').textContent = manifest;
  document.getElementById('install').href = manifest.replace(/^https?:\/\//, 'stremio://');
</script>
</body>
</html>
